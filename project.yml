name: Tuner
options:
  bundleIdPrefix: app.tuner
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tuner:
    type: application
    platform: macOS
    sources:
      - path: Tuner
    info:
      path: Tuner/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tuner.mac
        PRODUCT_NAME: Tuner
        SWIFT_OBJC_BRIDGING_HEADER: Tuner/Player/Tuner-Bridging-Header.h
        HEADER_SEARCH_PATHS: /opt/homebrew/include
        LIBRARY_SEARCH_PATHS: /opt/homebrew/lib
        OTHER_LDFLAGS: -lmpv
        GCC_PREPROCESSOR_DEFINITIONS: GL_SILENCE_DEPRECATION=1
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
